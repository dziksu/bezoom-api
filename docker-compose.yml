# ─────────────────────────────────────────────────────────────────────────────
# Bezoom – Local Development Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
#
# SERVICES
#   api          – NestJS API (hot reload + migrations)
#   postgres     – PostGIS-enabled PostgreSQL
#   redis        – Redis (cache + message queue)
#   minio        – S3-compatible object storage
#   minio-init   – Creates required MinIO buckets on startup
#   keycloak     – Identity & access management (SSO)
#   mailpit      – Local SMTP server + web UI
#   redis-commander – Redis GUI (queue browser)
#   nominatim    – Geocoding (OSM) — first run downloads ~1 GB of OSM data
#   redis-insight – Redis GUI (profiler + CLI)
#
# QUICK START
#   cp .env.example .env.local
#   docker compose up -d                      # start all services
#   docker compose --profile observability up -d --build
#
# PORTS OVERVIEW
#   4000  – BeZoom API    → http://localhost:4000/api
#   5432  – PostgreSQL
#   6379  – Redis
#   9000  – MinIO S3 API
#   9001  – MinIO Console  → http://localhost:9001
#   8080  – Keycloak       → http://localhost:8080
#   1025  – Mailpit SMTP
#   8025  – Mailpit Web UI → http://localhost:8025
#   3010  – Redis Commander → http://localhost:3010
#   8082  – Nominatim      → http://localhost:8082
#   8001  – Redis Insight  → http://localhost:8001
#   9090  – Prometheus     → http://localhost:9090
#   3001  – Grafana        → http://localhost:3001
#
# ─────────────────────────────────────────────────────────────────────────────
# LICENSING NOTE: Redis 8.0+ uses a tri-license (RSALv2 / SSPLv1 / AGPLv3)
# instead of the old 3-clause BSD from 7.x. This is fine for local dev, but
# review the license before using in production.
# ─────────────────────────────────────────────────────────────────────────────

name: bezoom

services:
  api:
    build:
      context: .
      target: development
    restart: unless-stopped
    environment:
      CI: 'true'
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bezoom}:${POSTGRES_PASSWORD:-bezoom_dev}@postgres:5432/bezoom
      DATABASE_READ_URL: postgresql://${POSTGRES_USER:-bezoom}:${POSTGRES_PASSWORD:-bezoom_dev}@postgres:5432/bezoom
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      MINIO_USE_SSL: 'false'
      MINIO_RAW_BUCKET: raw-uploads
      MINIO_MEDIA_BUCKET: media
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/bezoom/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_HTTP_PORT:-8080}/realms/bezoom
      KEYCLOAK_CLIENT_ID: bezoom-api
      OTEL_SERVICE_NAME: bezoom-api
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health/ready >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ───────────────────────────────────────────────────────────────────────────
  # DATABASE
  # ───────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgis/postgis:16-3.5-alpine
    platform: linux/amd64 # multi-arch image; amd64 runs via Rosetta on Apple Silicon
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bezoom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bezoom_dev}
      POSTGRES_DB: bezoom
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bezoom} -d bezoom']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m' # Caps the log file at 10 Megabytes
        max-file: '3' # Keeps a maximum of 3 old log files

  # PgBouncer (connection pooling) — not needed for local dev.
  # In production, deploy via Coolify using the edoburu/pgbouncer image.
  # App services connect directly to postgres:5432 in local dev.

  # ───────────────────────────────────────────────────────────────────────────
  # CACHE + MESSAGE QUEUE
  # ───────────────────────────────────────────────────────────────────────────

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_dev}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_dev}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  # OBJECT STORAGE (S3-compatible)
  # ───────────────────────────────────────────────────────────────────────────

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m' # Caps the log file at 10 Megabytes
        max-file: '3' # Keeps a maximum of 3 old log files

  # Creates required buckets after MinIO is ready
  minio-init:
    image: minio/mc:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/raw-uploads;
        mc mb --ignore-existing local/media;
        mc ilm rule add --expiry-days 1 local/raw-uploads;
        mc anonymous set download local/media;
        echo 'MinIO buckets initialized';
        exit 0;
      "

  # ───────────────────────────────────────────────────────────────────────────
  # AUTHENTICATION (Keycloak)
  # ───────────────────────────────────────────────────────────────────────────

  keycloak:
    image: keycloak/keycloak:latest
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-bezoom}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-bezoom_dev}
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: 'false'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '${KEYCLOAK_HTTP_PORT:-8080}:8080'
    volumes:
      - ./bezoom-realm.json:/opt/keycloak/data/import/bezoom-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "{ printf 'GET /health/live HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3; } 3<>/dev/tcp/127.0.0.1/9000"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ───────────────────────────────────────────────────────────────────────────
  # EMAIL (local SMTP + web UI)
  # ───────────────────────────────────────────────────────────────────────────

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data

  # ───────────────────────────────────────────────────────────────────────────
  # OBSERVABILITY (opt-in: docker compose --profile observability up -d)
  # ───────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ['observability']
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./docker/observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  loki:
    image: grafana/loki:3.5.3
    profiles: ['observability']
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '${LOKI_PORT:-3100}:3100'
    volumes:
      - ./docker/observability/loki/config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.10.2
    profiles: ['observability']
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - '${ALLOY_PORT:-12345}:12345'
    volumes:
      - ./docker/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ['observability']
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  # ───────────────────────────────────────────────────────────────────────────
